<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="margin:0"><title>Leopard Mark Ops Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Leopard Mark Ops Hub — interactive UI spec (dark-first, brand navy)
   Tokens mirror public/rep-app/assets/css/app.css + the prototype hub.
   Brand faces (Bowery Lane / Tomato Grotesk / Bogart) are licensed and
   not shipped here; Barlow Condensed / Barlow / IBM Plex Mono stand in.
   ============================================================ */
:root{
  color-scheme: dark;
  --navy-950:#050b18; --navy-900:#0a1730; --navy-800:#10203f; --navy-700:#182d4e; --navy-600:#223c63; --navy-500:#2f4f7f;
  --canvas:var(--navy-950); --surface:var(--navy-900); --surface-2:var(--navy-800); --surface-3:var(--navy-700);
  --line:rgba(185,196,214,.14); --line-strong:rgba(185,196,214,.28);
  --ink:#f4f6fa; --ink-2:#b9c4d6; --ink-3:#7c8aa3; --ink-4:#55627a;
  --accent:#3987e5; --accent-ink:#8fbdf5; --accent-soft:rgba(57,135,229,.16);
  --good:#199e70; --warn:#c98500; --serious:#d95926; --critical:#d55181;
  --good-soft:rgba(25,158,112,.16); --warn-soft:rgba(201,133,0,.16); --serious-soft:rgba(217,89,38,.16); --critical-soft:rgba(213,81,129,.16);
  /* stage ramp: sequential blue → white (progress), not status */
  --st1:#192f70; --st2:#24428f; --st3:#315095; --st4:#4f6bb5; --st5:#7d86cd; --st6:#a7afe5; --st7:#dbe3f6;
  --font-display:'Barlow Condensed','Bowery Lane',system-ui,sans-serif;
  --font-body:'Barlow','Tomato Grotesk',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  --r:10px; --r-sm:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--accent-ink);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.93em}
.mono{font-family:var(--font-mono)}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:.005em;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px;line-height:1.15}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)}
.small{font-size:12px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.crest{width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,#f4f6fa,#b9c4d6);display:grid;place-items:center;color:var(--navy-900);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.04em}
.brand .wm{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1;letter-spacing:.02em}
.brand .wm small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500}
.nav a .ic{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--ink)}
.nav a.on .ic{opacity:1;color:var(--accent-ink)}
.nav a .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);background:var(--surface-3);padding:1px 7px;border-radius:999px}
.nav a .cnt.hot{color:#fff;background:var(--serious)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.rail .foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.rail .foot b{color:var(--ink-2);font-weight:500}
.main{min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--canvas);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;color:var(--ink-3)}
.search input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none}
.search kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--ink-3)}
.health{display:flex;gap:6px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.warn .dot{background:var(--warn)} .chip.bad .dot{background:var(--serious)}
.chip .t{color:var(--ink-3);font-family:var(--font-mono);font-size:11px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line)}
.page{padding:22px 28px 60px;max-width:1440px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--ink-3)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{border-color:rgba(217,89,38,.5);color:#ffb59a}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface-3);color:var(--ink)}

/* ---------- panels ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.g-attn{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel.flush{padding:0;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel.flush .panel-head{padding:14px 18px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row:hover td{background:var(--surface-2);cursor:pointer}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{overflow-x:auto}

/* ---------- stage & status ---------- */
.stage{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 6px;border-radius:999px;font-size:12px;font-weight:500;color:var(--ink);border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.stage i{width:8px;height:8px;border-radius:2px;flex:none}
.s1 i{background:var(--st1)} .s2 i{background:var(--st2)} .s3 i{background:var(--st3)} .s4 i{background:var(--st4)} .s5 i{background:var(--st5)} .s6 i{background:var(--st6)} .s7 i{background:var(--st7)}
.stage.blocked{border-color:rgba(217,89,38,.5);background:var(--serious-soft);color:#ffc7b0}
.stage.blocked i{background:var(--serious);border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:#7fe0bd} .pill.warn{background:var(--warn-soft);color:#f3c46a} .pill.serious{background:var(--serious-soft);color:#ffb59a} .pill.critical{background:var(--critical-soft);color:#ffa7c6} .pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.region{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line-strong);color:var(--ink-2)}

/* ---------- attention queue ---------- */
.attn{display:flex;flex-direction:column;gap:8px}
.attn .item{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px 10px 0;overflow:hidden}
.attn .item .bar{height:100%;min-height:44px;background:var(--warn)}
.attn .item.serious .bar{background:var(--serious)} .attn .item.critical .bar{background:var(--critical)} .attn .item.info .bar{background:var(--accent)}
.attn .item .t{font-weight:500}
.attn .item .m{color:var(--ink-3);font-size:12px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.owner{display:inline-flex;align-items:center;gap:5px}
.owner .avatar{width:18px;height:18px;font-size:9px}

/* ---------- pipeline strip ---------- */
.pipe{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pipe .col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;position:relative;overflow:hidden}
.pipe .col:hover{border-color:var(--line-strong)}
.pipe .col .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.pipe .col .k i{width:8px;height:8px;border-radius:2px}
.pipe .col .n{font-family:var(--font-display);font-size:30px;line-height:1;margin-top:8px;font-weight:600}
.pipe .col .v{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:4px}
.pipe .col .blk{margin-top:8px;display:inline-flex}

/* ---------- KPI ---------- */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi .d b{color:#7fe0bd;font-weight:500} .kpi .d b.down{color:#ffb59a}
.kpi svg{display:block;width:100%;height:36px;margin-top:8px}

/* ---------- feed ---------- */
.feed{display:flex;flex-direction:column}
.feed .ev{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.feed .ev:last-child{border-bottom:0}
.feed .who{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.04em;background:var(--surface-3);color:var(--ink-2)}
.feed .who.sys{background:var(--accent-soft);color:var(--accent-ink)} .feed .who.rep{background:var(--surface-3)} .feed .who.ops{background:rgba(219,227,246,.14);color:var(--ink)} .feed .who.cus{background:var(--good-soft);color:#7fe0bd} .feed .who.ai{background:var(--critical-soft);color:#ffa7c6}
.feed .when{font-family:var(--font-mono);font-size:11px;color:var(--ink-4);white-space:nowrap}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.bcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:320px;display:flex;flex-direction:column;gap:8px}
.bcol .bh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.bcol .bh i{width:8px;height:8px;border-radius:2px;margin-right:6px;display:inline-block;vertical-align:middle}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 10px 10px 12px;cursor:pointer;position:relative}
.card:hover{border-color:var(--line-strong)}
.card.blocked{border-left:3px solid var(--serious)}
.card .a{font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.card .li{color:var(--ink-2);font-size:12px;margin-top:3px}
.card .f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--ink-3)}
.card .f .num{color:var(--ink)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,11,24,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,96vw);background:var(--surface);border-left:1px solid var(--line-strong);z-index:21;transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:-30px 0 60px rgba(0,0,0,.4)}
body.open .scrim{opacity:1;pointer-events:auto} body.open .drawer{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dhead{padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:1}
.dhead .x{margin-left:auto}
.dbody{padding:20px 24px 40px;display:grid;gap:18px}
.tl{display:grid;gap:0}
.tl .n{display:grid;grid-template-columns:22px 1fr;gap:14px;position:relative;padding-bottom:16px}
.tl .n::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl .n:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--st5);background:var(--surface);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-2)}
.tl .done .dot{background:var(--st6);border-color:var(--st6);color:var(--navy-900);font-weight:600}
.tl .now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl .future .dot{border-style:dashed;border-color:var(--line-strong);color:var(--ink-4)}
.tl .future .t,.tl .future .m{color:var(--ink-4)}
.tl .t{font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tl .t .when{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);font-weight:400}
.tl .m{font-size:12px;color:var(--ink-2);margin-top:3px}
.tl .art{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);font-size:11px;color:var(--ink-2);font-family:var(--font-mono)}
.tag.link{color:var(--accent-ink);border-color:rgba(57,135,229,.35)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.blockbar{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--serious-soft);border:1px solid rgba(217,89,38,.45);color:#ffc7b0;font-size:13px}
.blockbar .btn{margin-left:auto}

/* ---------- week view ---------- */
.week{display:grid;grid-template-columns:220px repeat(5,1fr);gap:8px}
.week .day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:260px}
.week .day .dh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.week .day .dh b{font-family:var(--font-display);font-size:18px;font-weight:600}
.week .day .dh .num{color:var(--ink-3);font-size:11px}
.week .day.off{background:transparent;border-style:dashed}
.week .tray{background:var(--surface-2)}
.ship{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:6px;font-size:12px}
.ship b{display:block;font-weight:600;font-size:13px}
.ship .m{color:var(--ink-3);margin-top:2px;display:flex;justify-content:space-between}

/* ---------- inventory matrix ---------- */
.matrix td.q{text-align:right;font-family:var(--font-mono)}
.matrix td.low{color:#f3c46a} .matrix td.out{color:#ffb59a}
.matrix th.wh{color:var(--accent-ink)}
.bar-h{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--st5)}

/* ---------- checklist ---------- */
.ck{display:flex;gap:2px}
.ck i{width:14px;height:6px;border-radius:2px;background:var(--surface-3)}
.ck i.y{background:var(--good)} .ck i.n{background:var(--serious)}

/* ---------- rule cards ---------- */
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 14px}
.rule h4{font-family:var(--font-body);font-weight:600;font-size:14px}
.rule .m{color:var(--ink-3);font-size:12px;margin-top:2px}
.rule .runs{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-3);margin-top:4px}
.rule .runs .spark{display:flex;gap:2px;align-items:flex-end;height:18px}
.rule .runs .spark i{width:5px;background:var(--good);border-radius:1px;opacity:.8}
.rule .runs .spark i.f{background:var(--serious)}
.tog{width:38px;height:22px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-strong);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.tog.on{background:var(--good);border-color:var(--good)} .tog.on::after{background:#fff;transform:translateX(16px)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--surface-3);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;opacity:0;transition:.25s;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}

/* ---------- spec notes (design-intent callouts, not product UI) ---------- */
.spec{border:1px dashed rgba(143,189,245,.45);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;color:var(--accent-ink);background:rgba(57,135,229,.06)}
.spec b{color:var(--ink);font-weight:600}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.state{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;color:var(--ink-3);font-size:12px}
.skel{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface-3),var(--navy-600),var(--surface-3));background-size:200% 100%;animation:sh 1.4s infinite;width:70%}
.skel.s{width:45%}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

@media (max-width:1100px){.g5{grid-template-columns:repeat(2,1fr)} .g-attn{grid-template-columns:1fr} .g3{grid-template-columns:1fr} .week{grid-template-columns:1fr;} .states{grid-template-columns:repeat(2,1fr)}}

const money = n => '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

 {id:'01J6Z…M2', inv:'INV26282', acct:'Echo Park Cantina', region:'LA', rep:'Dany', ch:'sms', stage:'new_order', age:'40m', lines:[['CNT1AKHB01','Cantinesca ½ bbl',2,192]], wh:'WH-WIL', billing:'owner@echoparkcantina.example'},

/* ---------------- router ---------------- */

 ['deliveries','Deliveries','M3 7h11v9H3zM14 10h4l3 3v3h-7zM6 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm12 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z'],
 ['inventory','Inventory','M4 8l8-4 8 4v9l-8 4-8-4zM4 8l8 4 8-4M12 12v9', ()=>1],

  const cur = location.hash.replace('#','')||'home';

    return sep+`<a href="#${k}" class="${cur===k?'on':''}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="${d}"/></svg>${n}${c}</a>`;
  }).join('');
}
const VIEWS = {};
function route(){ renderNav(); const k=location.hash.replace('#','')||'home'; const [name,arg]=k.split('/'); document.getElementById('view').innerHTML=(VIEWS[name]||VIEWS.home)(arg); window.scrollTo(0,0); }

/* ---------------- helpers ---------------- */
const stageChip = o => o.blocked ? `<span class="stage blocked" title="${o.blocked}"><i></i>Blocked · ${STAGES[SI[o.stage]].n}</span>` : `<span class="stage ${STAGES[SI[o.stage]].s}"><i></i>${STAGES[SI[o.stage]].n}</span>`;
const linesSummary = o => o.lines.map(l=>`${l[2]}× ${l[1].replace(/Sunlight Groove (BA|SoCal)/,'SG$1').replace('Cantinesca','CNT').replace('Giro Splendido','GSP').replace(' · case 12oz×24',' case')}`).join(' · ');
const owner = (n) => `<span class="owner"><span class="avatar">${n.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>${n}</span>`;
function spark(vals,w=200,h=36,fill=true){const max=Math.max(...vals),min=Math.min(...vals);const pts=vals.map((v,i)=>[i*(w/(vals.length-1)),h-4-((v-min)/(max-min||1))*(h-10)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const last=pts[pts.length-1];return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${fill?`<path d="${d} L${w} ${h} L0 ${h}Z" fill="rgba(57,135,229,.14)"/>`:''}<path d="${d}" fill="none" stroke="#3987e5" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#8fbdf5"/></svg>`;}
function toast(msg){const t=document.getElementById('toast');document.getElementById('toastmsg').textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3600);}

    {sev:'serious', t:'Hopscotch Tavern — delivered this morning, invoice can’t send: no billing email on file', m:['Stripe · issue_invoice retry 2/5','5 hours','Ops'], a:'Add email & send', id:'01J6Z…V3'},

  <div class="grid g-attn" style="margin-bottom:16px">

      <div class="panel-head"><h3>Needs attention</h3><span class="small muted">ranked by consequence · each has one owner and one action</span></div>
      <div class="attn">${attn.map(a=>`<div class="item ${a.sev}"><div class="bar"></div><div><div class="t">${a.t}</div><div class="m">${a.m.slice(0,2).map(x=>`<span>${x}</span>`).join('')}${owner(a.m[2])}</div></div><button class="btn sm" onclick="${a.id?`openOrder('${a.id}')`:`toast('${a.a}')`}">${a.a}</button></div>`).join('')}</div>
    </section>
    <div class="grid" style="align-content:start">
      <section class="panel">
        <div class="panel-head"><h3>Today · Wed Sep 3 deliveries</h3><span class="region">LA</span></div>
        ${today.map(o=>`<div class="ship" style="cursor:pointer" onclick="openOrder('${o.id}')"><b>${o.acct} <span class="muted small mono">${o.inv}</span></b><div class="m"><span>${linesSummary(o)}</span><span class="num">${o.sched.split('·')[1]}</span></div><div class="m"><span>${o.wh} · ${o.carrier}</span><span>${kegsOf(o)} kegs · ${o.empties?o.empties+' empty pickup':'no empties'}</span></div></div>`).join('')}

      </section>
    </div>
  </div>

  <div class="grid g5" style="margin-bottom:16px">
    ${[['Orders this week',7,'<b>+2</b> vs last week',[3,5,4,6,5,7,7]],['Invoiced MTD',money0(1128),'2 invoices open',[600,600,900,1128,1128,1128,1128]],['Collected MTD',money0(627),'<b>56%</b> of invoiced',[0,0,435,435,627,627,627]],['Confirm → delivered','2.4 d','<b class="down">+0.3 d</b> vs Aug',[2.1,2.0,2.3,2.2,2.6,2.5,2.4]],['Kegs out in trade',41,'$1,435 deposit exposure',[30,33,35,38,37,40,41]]].map(([l,v,d,s])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div>${spark(s)}</div>`).join('')}

/* ---------------- Orders board / table ---------------- */
let boardMode='board';

  const list = filter ? ORDERS.filter(o=>o.stage===filter) : ORDERS;

/* ---------------- Order detail drawer ---------------- */
function openOrder(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const i = SI[o.stage]; const total=totalOf(o); const kegs=kegsOf(o); const dep=kegs*35; const ret=(o.empties||0)*35;
  const node = (n,idx,t,m,art)=>{const cls= idx<i?'done':idx===i?'now':'future'; return `<div class="n ${cls}"><div class="dot">${idx<i?'✓':idx+1}</div><div><div class="t">${t}${cls!=='future'?`<span class="when">${n}</span>`:''}</div><div class="m">${m}</div>${art&&cls!=='future'?`<div class="art">${art}</div>`:''}</div></div>`};
  const tl = [
